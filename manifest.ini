[ABOUT]
NAME = VGS Display
AUTHOR = Ahmed
VERSION = 1.10
DESCRIPTION = Live grip, slides, torque, steering, direction of travel, understeer and oversteer, per wheel and laid out like the car. Inspired by Enthusia's VGS.

